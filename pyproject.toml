[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "krok-ide"
dynamic = ["version"]
description = "Zjednodušené vývojové prostredie pre Python s vizualizáciou výpočtu"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6-Essentials~=6.8.3",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil",
]

[project.gui-scripts]
krok = "krok.app:main"

[tool.setuptools.dynamic]
version = { attr = "krok.__version__" }

[tool.setuptools.package-data]
"krok.translations" = ["*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not perf"]
markers = ["perf: meranie výkonu, spúšťa sa samostatne cez pytest -m perf"]
xfail_strict = true
qt_api = "pyside6"

[tool.coverage.run]
source_pkgs = ["krok.backend", "krok.common"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/golden/programs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
exclude = ["tests/golden/programs/"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# QtBot z pytest-qt nemá typové anotácie (keyClick a pod.).
module = ["tests.*"]
disallow_untyped_calls = false
